services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: andromeda_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - andromeda_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d andromeda_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  andromeda_postgres_data: